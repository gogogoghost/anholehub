name: Release

on:
  push:
    tags:
      - "[0-9]*/[0-9]*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANLOBEHUB_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANLOBEHUB_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANLOBEHUB_KEY_ALIAS }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \n\r\t' | base64 -d > "$RUNNER_TEMP/release.keystore"
          # Fail fast: verify password + alias before the 5-min build.
          keytool -list -keystore "$RUNNER_TEMP/release.keystore" \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null
      - name: Derive version from tag
        id: version
        run: |
          # Tag rule: "<versionCode>/<versionName>", e.g. "126/1.0.15".
          CODE="${GITHUB_REF_NAME%%/*}"
          NAME="${GITHUB_REF_NAME#*/}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "file=anlobehub-v${NAME}(${CODE}).apk" >> "$GITHUB_OUTPUT"

      - name: Assemble release APK
        env:
          ANLOBEHUB_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANLOBEHUB_KEYSTORE_PASSWORD: ${{ secrets.ANLOBEHUB_KEYSTORE_PASSWORD }}
          ANLOBEHUB_KEY_ALIAS: ${{ secrets.ANLOBEHUB_KEY_ALIAS }}
          ANLOBEHUB_KEY_PASSWORD: ${{ secrets.ANLOBEHUB_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --console=plain \
            -PversionName="${{ steps.version.outputs.name }}" \
            -PversionCode="${{ steps.version.outputs.code }}"

      - name: Rename APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          mv "$APK" "${{ steps.version.outputs.file }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.version.outputs.file }}
          generate_release_notes: true
